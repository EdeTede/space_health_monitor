<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EVKIWI · Sign in</title>
<link rel="icon" type="image/png" href="brand/kiwinaut-mark.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="evkiwi.css">
<style>
.hero{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.box{width:min(860px,100%);display:grid;gap:26px}
.head{text-align:center;display:grid;gap:10px;justify-items:center}
.head img{width:56px;height:56px;filter:drop-shadow(0 0 18px rgba(142,224,79,.5))}
.head h1{font-family:var(--display);font-size:clamp(32px,5vw,50px);margin:0;letter-spacing:.01em}
.head p{margin:0;color:var(--dim);font-size:16px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.role{display:grid;gap:10px;text-align:left;padding:26px 24px;border-radius:20px;border:1px solid var(--edge2);background:var(--panel);transition:border-color .3s var(--ease),transform .3s var(--ease),background .3s var(--ease)}
.role:hover{transform:translateY(-2px);border-color:var(--kiwi);background:rgba(142,224,79,.07)}
.role .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:rgba(142,224,79,.14);color:var(--kiwi);font-size:24px}
.role.pl .ic{background:rgba(255,200,87,.14);color:var(--amber)}
.role.pl:hover{border-color:var(--amber);background:rgba(255,200,87,.06)}
.role h2{margin:0;font-family:var(--display);font-size:26px}
.role p{margin:0;color:var(--dim);line-height:1.5}
.step{display:none;gap:16px}
.step.on{display:grid}
.crew{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pick{display:grid;justify-items:center;gap:8px;padding:22px 12px;border-radius:18px;border:1px solid var(--edge2);background:var(--panel);transition:border-color .3s var(--ease),background .3s var(--ease)}
.pick:hover{border-color:var(--kiwi);background:rgba(142,224,79,.08)}
.pick .avatar{width:64px;height:64px;font-size:20px}
.pick b{font-size:16px}
.pick small{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.pin{display:grid;gap:12px;justify-items:center;padding:26px;border-radius:20px;border:1px solid rgba(255,200,87,.35);background:var(--panel)}
.pin input{width:200px;text-align:center;font-family:var(--display);font-size:30px;letter-spacing:.4em;padding:10px 12px;border-radius:14px;border:1px solid var(--edge2);background:rgba(0,0,0,.3);color:var(--fg)}
.pin .err{color:var(--red);font-size:13px;min-height:18px}
.back{justify-self:center;color:var(--dim);font-size:14px}
.back:hover{color:var(--fg)}
.links{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--dim)}
.links a{text-decoration:none;border-bottom:1px solid transparent}
.links a:hover{color:var(--kiwi);border-color:var(--edge2)}
@media (max-width:640px){.roles{grid-template-columns:1fr}.crew{grid-template-columns:1fr}.pick{grid-template-columns:auto 1fr;justify-items:start;align-items:center;text-align:left}.pick .avatar{grid-row:1/3}}
</style>
</head>
<body>
<main class="hero">
  <div class="box">
    <div class="head">
      <img src="brand/kiwinaut-mark.png" alt="">
      <h1>EVKIWI</h1>
      <p>Extra safe hours outside. Who is signing in?</p>
    </div>

    <section class="step on" id="s0" aria-label="Choose your role">
      <div class="roles">
        <button class="role" id="pickAstro" type="button">
          <span class="ic" aria-hidden="true">◉</span>
          <h2>Astronaut</h2>
          <p>Your health today, simple graphs, and your week with suggested changes.</p>
        </button>
        <button class="role pl" id="pickPlanner" type="button">
          <span class="ic" aria-hidden="true">▦</span>
          <h2>Mission planner</h2>
          <p>The whole crew: readiness, timelines, approvals and every tool.</p>
        </button>
      </div>
    </section>

    <section class="step" id="s1" aria-label="Pick your crew profile">
      <p class="lbl" style="text-align:center">Tap your name</p>
      <div class="crew" id="crew"></div>
      <button class="back" type="button" data-back>← Back</button>
    </section>

    <section class="step" id="s2" aria-label="Planner sign-in">
      <form class="pin" id="pinForm" autocomplete="off">
        <span class="lbl">Planner · Morgan Bettre</span>
        <input id="pin" inputmode="numeric" maxlength="4" aria-label="Demo PIN" placeholder="····">
        <span class="muted" style="font-size:13px">Demo PIN <b style="color:var(--amber)">2026</b> · sample only, not a real password</span>
        <span class="err" id="pinErr" role="alert"></span>
        <button class="btn primary" type="submit">Open mission control</button>
      </form>
      <button class="back" type="button" data-back>← Back</button>
    </section>

    <div class="links"><a href="kiwinaut-eva.html">Watch the 3D spacewalk</a><span>·</span><span>Demo sign-in · sample data · not an official NASA product</span></div>
  </div>
</main>
<script src="evkiwi-core.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id);
const go=s=>location.replace(s.kind==='planner'?'/mission-control.html':'/astronaut.html');
const params=new URLSearchParams(location.search);
if(params.get('logout')==='1'){EVK.clearSession();history.replaceState(null,'','/')}
const s=EVK.getSession();if(s&&!params.has('switch'))go(s);
const show=i=>{for(const k of['s0','s1','s2'])$(k).classList.toggle('on',k==='s'+i);if(i===2)setTimeout(()=>$('pin').focus(),50)};
$('crew').innerHTML=EVK.CREW.map(c=>`<button class="pick" type="button" data-id="${c.id}"><span class="avatar">${c.initials}</span><b>${c.name}</b><small>${c.role}</small></button>`).join('');
$('pickAstro').onclick=()=>show(1);
$('pickPlanner').onclick=()=>show(2);
document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>show(0));
$('crew').onclick=e=>{const b=e.target.closest('[data-id]');if(!b)return;go(EVK.signInAstronaut(b.dataset.id))};
$('pinForm').onsubmit=e=>{e.preventDefault();const s=EVK.signInPlanner($('pin').value);if(!s){$('pinErr').textContent='That PIN does not match. The demo PIN is 2026.';return}go(s)};
})();
</script>
</body>
</html>
