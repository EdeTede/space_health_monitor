<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="brand/kiwinaut-mark.png">
<title>Kiwinaut · Decompression gate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --void:#03060d; --hud:rgba(10,22,40,.9); --edge:rgba(142,224,79,.24);
  --fg:#eef6e8; --dim:#93a68f; --holo:#8ee04f; --kiwi:#c6f27a;
  --amber:#ffc857; --hot:#ff8a3d; --red:#ff5d6c; --ok:#5ef0c2;
  --display:"Syne","Chakra Petch",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--void);color:var(--fg);font-family:var(--body)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
[hidden]{display:none!important}

/* Garra-inspired top nav: logo+slogan left, quiet links + one pill CTA right */
.topnav{
  position:fixed;left:0;right:0;top:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:14px clamp(16px,3vw,28px);
  background:rgba(3,6,13,.82);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(142,224,79,.1);
  pointer-events:none;
}
.topnav > *{pointer-events:auto}
.topnav-brand{display:grid;gap:3px;min-width:0}
.topnav-lock{display:flex;align-items:center;gap:10px}
.topnav-lock img{width:26px;height:26px;object-fit:contain;filter:drop-shadow(0 0 10px rgba(142,224,79,.4))}
.topnav-lock .name{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.02em}
.topnav-slogan{
  margin:0;max-width:28ch;
  font-family:var(--body);font-weight:400;font-size:12.5px;line-height:1.3;
  color:rgba(238,246,232,.7);letter-spacing:.01em;
}
.topnav-actions{display:flex;align-items:center;gap:4px;flex-wrap:nowrap;justify-content:flex-end}
.topnav-actions .link{
  font-family:var(--body);font-size:13px;font-weight:500;letter-spacing:.01em;
  color:rgba(238,246,232,.58);padding:8px 11px;border-radius:999px;white-space:nowrap;
  transition:color .25s ease,background .25s ease;
}
.topnav-actions .link:hover{color:var(--fg);background:rgba(255,255,255,.04)}
.topnav-actions .link.on{color:var(--fg)}
.topnav-actions .pill{
  margin-left:8px;font-family:var(--body);font-size:13px;font-weight:600;letter-spacing:.01em;
  color:#02121c;background:var(--holo);padding:9px 15px;border-radius:999px;white-space:nowrap;
  box-shadow:0 0 22px rgba(142,224,79,.25);
  transition:filter .2s ease;
}
.topnav-actions .pill:hover{filter:brightness(1.06)}
@media (max-width:820px){
  .topnav{flex-wrap:wrap;row-gap:10px}
  .topnav-brand{width:100%}
  .topnav-actions{width:100%;justify-content:flex-start;overflow-x:auto;padding-bottom:2px}
  .topnav-slogan{max-width:none}
}

.phase{position:fixed;inset:0;display:grid;padding-top:0}
.phase iframe{border:0;width:100%;height:100%;background:var(--void)}
#phaseCalc{grid-template-rows:1fr}
#phaseCalc iframe{min-height:0;height:100%}
.cta{
  font:600 13px var(--body);letter-spacing:.02em;
  border:0;border-radius:999px;padding:10px 16px;cursor:pointer;
  background:var(--holo);color:#02121c;
}
.cta:hover{filter:brightness(1.06)}
.cta:disabled{opacity:.55;cursor:wait;filter:none}
.cta.ghost{
  background:transparent;color:rgba(238,246,232,.7);border:1px solid rgba(142,224,79,.22);
}
.cta-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.recs{
  position:relative;z-index:1;min-height:100%;overflow:auto;
  padding:clamp(88px,12vh,120px) clamp(16px,3vw,32px) clamp(16px,3vw,32px);
  background:
    radial-gradient(ellipse 60% 40% at 50% 0%,rgba(142,224,79,.12),transparent 55%),
    var(--void);
}
.recs-inner{width:min(980px,100%);margin:0 auto;display:grid;gap:16px}
.recs-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.recs-top .brand{display:flex;align-items:center;gap:10px}
.recs-top .brand img{width:40px;height:40px}
.recs-top h1{font-family:var(--display);font-size:clamp(22px,3vw,32px);margin:4px 0 0;line-height:1.1}
.recs-top .k{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--holo)}
.verdict{text-align:right}
.verdict .q{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.verdict .big{font-family:var(--display);font-weight:800;font-size:clamp(40px,7vw,64px);line-height:1;font-variant-numeric:tabular-nums}
.verdict .tag{font-family:var(--mono);font-size:12px;letter-spacing:.08em;margin-top:4px}

.panel{
  border:1px solid var(--edge);border-radius:10px;padding:16px 18px;
  background:rgba(8,18,32,.88);backdrop-filter:blur(12px);
}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--holo);text-transform:uppercase;margin:0 0 10px;font-weight:500}
.grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.chip{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.1em;padding:4px 8px;border:1px solid currentColor;border-radius:3px}
.chip.green{color:var(--ok)}.chip.yellow{color:var(--amber)}.chip.orange{color:var(--hot)}.chip.red{color:var(--red)}
.dial-wrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.dial svg{width:120px;height:120px;display:block}
.blurb{margin:8px 0 0;color:var(--dim);font-size:13px;line-height:1.45}
.meta{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:10px;font-family:var(--mono);font-size:11px;color:var(--dim)}
.meta b{color:var(--fg);font-weight:500}
.coach{font-family:var(--mono);font-size:13px;line-height:1.55;min-height:3.2em;border:1px solid rgba(142,224,79,.22);border-radius:4px;padding:12px;background:rgba(0,0,0,.38);color:var(--holo);margin-top:12px}
.coach .cursor{display:inline-block;width:8px;height:1.1em;background:var(--holo);margin-left:2px;vertical-align:-2px;animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}
.why{display:grid;gap:6px}
.why .hit{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:7px 9px;border-radius:4px;background:rgba(142,224,79,.05);border:1px solid rgba(142,224,79,.1)}
.why .hit b{font-family:var(--mono);font-weight:500}
.why .hit.push{border-color:rgba(255,200,87,.35);background:rgba(255,200,87,.08)}
.plan{margin:0;font-size:13px;line-height:1.5;color:var(--dim)}
.plan b{color:var(--fg)}
.cards{display:grid;gap:8px;margin-top:12px}
.acard{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:start;padding:14px;border:1px solid var(--edge);border-radius:6px;background:rgba(8,18,32,.95);transform:translateX(22px);opacity:0;transition:transform .45s ease,opacity .45s ease,border-color .3s}
.acard.in{transform:none;opacity:1}
.acard.accepted{border-color:var(--ok);background:rgba(94,240,194,.1)}
.acard .ico{width:36px;height:36px;border-radius:4px;display:grid;place-items:center;font-family:var(--mono);font-size:11px;border:1px solid currentColor}
.acard .t{font-family:var(--display);font-size:16px;line-height:1.2}
.acard .r{font-size:12px;color:var(--dim);margin-top:4px}
.acard .ops{display:flex;flex-direction:column;gap:6px}
.acard .ops button{font:600 11px var(--display);letter-spacing:.06em;padding:7px 11px;border-radius:3px;cursor:pointer;border:1px solid var(--edge);background:transparent;color:var(--holo);white-space:nowrap}
.acard .ops .ok{background:var(--holo);color:#02121c;border:0}
.api-pill{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:5px 9px;border-radius:999px;border:1px solid var(--edge);color:var(--dim)}
.api-pill.live{color:var(--ok);border-color:rgba(94,240,194,.45)}
.api-pill.off{color:var(--amber)}
.foot{margin:8px 0 24px;font-size:11px;color:var(--dim);line-height:1.45}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.steps span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:4px 8px;border:1px solid transparent;border-radius:3px}
.steps span.on{color:var(--holo);border-color:var(--edge)}
@media (prefers-reduced-motion:reduce){
  .acard{transition:none;transform:none;opacity:1}
  .coach .cursor{animation:none}
}
</style>
</head>
<body>

<header class="topnav" id="topnav">
  <div class="topnav-brand">
    <div class="topnav-lock">
      <img src="brand/kiwinaut-mark.png" width="28" height="28" alt="">
      <span class="name">Kiwinaut</span>
    </div>
    <p class="topnav-slogan">Small test for extra spacewalk time.</p>
  </div>
  <nav class="topnav-actions" aria-label="Primary">
    <button type="button" class="link" id="navSpace" data-go="entry">Spacewalk</button>
    <button type="button" class="link" id="navDlco" data-go="calc">DLCO test</button>
    <button type="button" class="link" id="navCalendar" data-go="calendar">Calendar</button>
    <a class="link" href="risk-methods.html" target="_blank" rel="noopener">Risk methods</a>
    <a class="link" href="developer-tasks.html" target="_blank" rel="noopener">Developer</a>
    <button type="button" class="link" id="navRecs" data-go="recs">Recommendations</button>
    <button type="button" class="pill" id="navEnter" data-go="calc">Enter DRI</button>
  </nav>
</header>

<!-- Phase 1: full kiwinaut-eva animation -->
<section class="phase" id="phaseEntry" aria-label="Spacewalk entry">
  <iframe id="entryFrame" title="" src="/kiwinaut-eva.html?embed=1&auto=1&v=10" allow="fullscreen"></iframe>
</section>

<!-- Phase 2: full eva-calc -->
<section class="phase" id="phaseCalc" hidden aria-label="EVA calculator">
  <iframe id="calcFrame" title="EVA Decompression Risk Calculator" src="about:blank"></iframe>
</section>

<!-- Calendar and recommendations share one persistent mission workspace. -->
<section class="phase" id="phasePlanner" hidden aria-label="Mission calendar and EVA recommendations">
  <iframe id="plannerFrame" title="Crew calendar and EVA recommendations" src="about:blank"></iframe>
</section>
<style>#phasePlanner{padding-top:90px}@media(max-width:820px){#phasePlanner{padding-top:145px}}</style>
<script>
(()=>{
 const $=id=>document.getElementById(id);let phase='entry';
 function showPhase(name){
  phase=name;
  $('phaseEntry').hidden=name!=='entry';$('phaseCalc').hidden=name!=='calc';
  $('phasePlanner').hidden=!['calendar','recs'].includes(name);
  for(const [id,route] of [['navSpace','entry'],['navDlco','calc'],['navCalendar','calendar'],['navRecs','recs']])$(id).classList.toggle('on',name===route);
  $('navEnter').textContent=name==='calc'?'EVA recommendations':'Enter DRI';
  if(name!=='entry')$('entryFrame').src='about:blank';
  else if(!$('entryFrame').src.includes('kiwinaut-eva'))$('entryFrame').src='/kiwinaut-eva.html?embed=1&auto=1&v=10';
  if(name==='calc'&&!$('calcFrame').src.includes('eva-calc'))$('calcFrame').src='/eva-calc.html';
  if(['calendar','recs'].includes(name)){
   if(!$('plannerFrame').src.includes('planner.html'))$('plannerFrame').src='/planner.html?view='+name;
   else $('plannerFrame').contentWindow.postMessage({type:'kiwinaut-planner-navigate',view:name},location.origin);
  }
 }
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>showPhase(b.dataset.go));
 $('navEnter').onclick=()=>showPhase(phase==='calc'?'recs':'calc');
 addEventListener('message',e=>{
  if(e.origin!==location.origin)return;
  if(e.source===$('plannerFrame').contentWindow&&e.data?.type==='kiwinaut-planner-view'){
   phase=e.data.view==='recs'?'recs':'calendar';$('navCalendar').classList.toggle('on',phase==='calendar');$('navRecs').classList.toggle('on',phase==='recs');
  }
  if(e.source===$('entryFrame').contentWindow&&e.data?.type==='kiwinaut-start-dlco')showPhase('calc');
  if(e.source===$('calcFrame').contentWindow&&e.data?.type==='kiwinaut-start-recs')showPhase('recs');
 });
 showPhase(location.hash==='#calendar'?'calendar':location.hash==='#recs'?'recs':'entry');
})();
</script>
</body></html>
