# Publish the EVKIWI frontend to GitHub Pages.
# The FastAPI backend can't run on Pages, so this serves frontend/ as static files.
# The main flow falls back to its local model when /api is unreachable.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build static site
        run: |
          set -euo pipefail
          rm -rf _site && cp -R frontend _site
          cd _site
          # Match the FastAPI routes: "/" is the 3D spacewalk, the main flow lives at flow.html.
          mv index.html flow.html
          cp kiwinaut-eva.html index.html
          # Pages serves the site under /<repo>/, so root-absolute links must be relative.
          for f in *.html; do
            sed -i -E \
              -e 's#(["'"'"'`])/index\.html#\1flow.html#g' \
              -e 's#href="/([?"])#href="./\1#g' \
              -e 's#(["'"'"'`(])/([A-Za-z][A-Za-z0-9_-]*\.(html|js|css|json|png))#\1\2#g' \
              "$f"
          done
          touch .nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
